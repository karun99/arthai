name: Security Regression

# Scheduled, deterministic re-scan of the Adaptive Security Layer:
# structure drift, secret sweep (incl. wallet material), rule self-test, and
# the full validation suite. Does NOT perform autonomous actions; findings are
# reported and recorded in security/incidents. See SECURITY_POLICY.md
# Sections 8.4, 12, 16.

on:
  schedule:
    - cron: "30 3 * * 1"   # every Monday 03:30 UTC
  workflow_dispatch:      # allow manual trigger

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  regression-scan:
    name: Security Regression Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect structural drift in security definitions
        run: |
          python3 - <<'PY'
          import os, sys
          required = [
            "security/definitions/authentication",
            "security/definitions/authorization",
            "security/definitions/injection",
            "security/definitions/dependencies",
            "security/definitions/data",
            "security/definitions/infrastructure",
            "security/definitions/automation",
            "security/definitions/availability",
            "security/definitions/finance",
            "security/rules",
            "security/tests",
            "security/mitigations",
            "security/incidents",
            "security/schemas",
          ]
          missing = [d for d in required if not os.path.isdir(d)]
          if missing:
              print("Missing security structure:", missing)
              sys.exit(1)
          print("Security definition structure intact.")
          PY

      - name: Re-run secret + wallet-material sweep (full history)
        run: |
          set -e
          if git grep -nE \
            -e "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" \
            -e "AKIA[0-9A-Z]{16}" \
            -e "sk-or-v1-[A-Za-z0-9]{20,}" \
            -e "ghp_[A-Za-z0-9]{36}" \
            -e "rzp_(test|live)_[A-Za-z0-9]{14}_[A-Za-z0-9]{14}" \
            -e "OWS_(PRIVATE|SEED|MNEMONIC)_KEY[ ]*=[ ]*[^ ]+" \
            $(git rev-list --all) -- 2>/dev/null; then
            echo "::warning::Secret/wallet pattern detected in git history."
          else
            echo "No secret patterns in repository history."
          fi

      - name: Validate detection rules still fire (self-test)
        run: |
          set -e
          python3 - <<'PY'
          import yaml, glob, os, sys
          ok = True
          for f in glob.glob('security/rules/*.yml') + glob.glob('security/rules/*.yaml'):
              try:
                  yaml.safe_load(open(f))
                  print(f"Rule OK: {f}")
              except Exception as e:
                  ok = False
                  print(f"Rule FAIL: {f}: {e}")
          sys.exit(0 if ok else 1)
          PY

      - name: Run security validation suite
        run: |
          python3 -m pip install --quiet pyyaml
          python3 security/tests/validate_security.py

      - name: Record clean scan marker
        run: |
          mkdir -p security/incidents
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "incident_id: scan-$(date -u +%Y%m%d)" > /tmp/marker.yml
          echo "status: clean" >> /tmp/marker.yml
          echo "date: ${ts}" >> /tmp/marker.yml
          echo "Automated regression scan completed at ${ts}"