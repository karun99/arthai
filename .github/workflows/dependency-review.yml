name: Dependency Review

# Blocks pull requests that introduce known-vulnerable or breaking dependency
# changes. Companion to SECURITY_POLICY.md Sections 8.2 / 8.3 and
# RULE-SEC-003.

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: true