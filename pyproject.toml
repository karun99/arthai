[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arthai-security"
version = "1.0.0"
description = "ArthAI Adaptive Security Layer — threat definitions, detection rules, mitigations and deterministic validation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Sai Karun Nandipati", email = "saikarun085@gmail.com" }]
keywords = ["security", "threat-model", "detection-rules", "mitigations", "validation"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arthai-security = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
