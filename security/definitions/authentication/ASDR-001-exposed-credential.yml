threat_id: ASDR-001
name: Exposed Credential
category: authentication
severity: High
status: active
first_observed: 2026-09-09
last_updated: 2026-09-09

description:
  Credentials or authentication material required by ArthAI (Razorpay keys,
  OpenRouter keys, S-AI keys, database URLs, Redis URLs) are unintentionally
  committed to the repository.

attack_pattern:
  Developer copies a value from a local .env into source, a test fixture, or a
  config file, then pushes. Scanning tools concatenate or interpolate secrets
  into repo history.

affected_component: any
affected_technology: Node.js, Next.js, Python

indicators:
  - Razorpay key_id/key_secret pairs (rzp_test_/rzp_live_)
  - OpenRouter/S-AI/LLM API keys
  - PostgreSQL/Supabase/Redis connection strings with passwords
  - JWT signing secrets
  - GitHub personal access tokens (ghp_/github_pat_)

detection:
  - gitleaks scan on push and PR
  - hardcoded-credential pattern gate in CI
  - GitHub Secret Scanning (repo-level)
  - quarterly manual audit of git history

mitigation:
  - revoke and rotate the exposed credential immediately
  - remove the secret from source and history (filter-repo) or recreate repo
  - move all secrets to environment variables only
  - verify no exposed secret remains in git history

validation:
  - security.yml gitleaks + hardcoded-secret jobs must pass on push and PR
  - security/tests/validate_security.py must pass
  - secret hygiene verification defined in RULE-SEC-001/RULE-SEC-005

reference: SECURITY_POLICY.md Sections 5, 8.1